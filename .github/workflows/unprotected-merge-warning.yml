name: Unprotected merge warning

# While main has no branch protection (no GitHub Pro), GitHub will not block a
# bad merge. This job says so on every pull request: one comment, updated on
# later pushes. Once main is protected it posts nothing. Source: spine-os D58.

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  warn:
    runs-on: ubuntu-latest
    steps:
      - name: Comment while main is unprotected
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          marker='<!-- spine-os:unprotected-merge-warning -->'
          protected=$(gh api "repos/$REPO/branches/$BASE" --jq .protected)
          existing=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq "[.[] | select(.body | contains(\"$marker\"))][0].id // empty")
          if [ "$protected" = "true" ]; then
            echo "$BASE is protected; no warning needed."
            exit 0
          fi
          body="$marker
          ⚠️ **\`$BASE\` has no branch protection.** GitHub will not block merging this pull request, even if a check fails or a review is missing. Merge only after CI is green, the reviewer reported no \`BLOCK:\` finding and the tester passed.

          _Posted by CI until branch protection is enabled on \`$BASE\`. Last checked: $(date -u +%Y-%m-%dT%H:%MZ)._"
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$existing" -f body="$body" > /dev/null
            echo "Updated warning comment $existing."
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" -f body="$body" > /dev/null
            echo "Posted warning comment."
          fi
