schema: spec-driven

context: |
  weather-app is the scratch repository for proving the spine-os delivery
  cycle (stage 0). It is a fork of Ayokanmi-Adejola/Weather-App: a static
  weather page in vanilla HTML, CSS and JavaScript (index.html, styles.css,
  script.js) that calls the Open-Meteo API from the browser. No build step and
  no dependencies. Checks are `npm run check` (syntax) and `npm test` (Node's
  built-in test runner, tests under test/), run in CI on every pull request.
  Pull requests target diegovdev/weather-app, never the upstream repository.
  One ticket = one branch = one pull request; commits use Conventional
  Commits. Diego merges every pull request.

